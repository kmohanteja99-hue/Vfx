<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>🎬 My Movies App</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>🎬 My Movies App</h1>

    <input
      type="text"
      id="search"
      placeholder="🔍 Search movies..."
      oninput="searchMovie()"
    >
  </header>


  <main class="container">

    <!-- Movie 1 -->
    <div class="movie">
      <h2>Movie 1</h2>

      <iframe
        src="https://www.youtube.com/embed/eAfsQoBngKY"
        title="Movie 1"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
      </iframe>

    </div>


    <!-- Movie 2 -->
    <div class="movie">
      <h2>Movie 2</h2>

      <iframe
        src="https://www.youtube.com/embed/QPuWL0ram2I"
        title="Movie 2"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
      </iframe>

    </div>


    <!-- Movie 3 -->
    <div class="movie">
      <h2>Movie 3</h2>

      <iframe
        src="https://www.youtube.com/embed/VIDEO_ID_3"
        title="Movie 3"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
      </iframe>

    </div>


    <!-- Movie 4 -->
    <div class="movie">
      <h2>Movie 4</h2>

      <iframe
        src="https://www.youtube.com/embed/VIDEO_ID_4"
        title="Movie 4"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
      </iframe>

    </div>

  </main>


  <script src="script.js"></script>

</body>
</html>
