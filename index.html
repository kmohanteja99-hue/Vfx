
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎬 My Movies Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <h1>🎬 My Movies</h1>
    <p class="subtitle">Your personal movie collection</p>
    <input
      type="search"
      id="search"
      placeholder="🔍 Search movies..."
      aria-label="Search movies"
    >
  </header>

  <main class="main">
    <section class="shelf">
      <div class="section-heading">
        <h2>📚 Movie Collection</h2>
        <span id="movieCount">4 movies</span>
      </div>

      <div class="movie-gallery" id="movieGallery"></div>
      <p id="noResults" class="no-results" hidden>
        No movies found.
      </p>
    </section>
  </main>

  <!-- Video player popup -->
  <div class="modal" id="videoModal" role="dialog"
       aria-modal="true" aria-label="Movie player" hidden>
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Now Playing</h2>
        <button id="closeModal" class="close-button"
                aria-label="Close video">✕</button>
      </div>
      <div class="video-container" id="videoContainer"></div>
    </div>
  </div>

  <footer>
    <p>🎬 My Movies Gallery</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
